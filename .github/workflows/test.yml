name: Chimera CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Checkout repo
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up Docker
    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    # Build Docker image
    - name: Build Chimera image
      run: docker build -t chimera-agent .

    # Run tests inside Docker
    - name: Run tests
      run: docker run --rm -v ${{ github.workspace }}:/app chimera-agent pytest tests/

      